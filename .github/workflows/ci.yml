name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (format, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Restore
        run: dotnet restore Jobpilot.slnx

      - name: Verify formatting
        run: dotnet format Jobpilot.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Jobpilot.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --solution Jobpilot.slnx
          --configuration Release --no-build
          --coverage --coverage-output-format cobertura
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
