name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # lets SonarCloud decorate PRs

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SONAR_PROJECT_KEY: RefactorNinja12_JobPilot
  SONAR_ORGANIZATION: refactorninja12

jobs:
  backend:
    name: Backend (format, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for accurate Sonar blame / new-code detection

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - uses: actions/setup-java@v4 # required by the Sonar scanner
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore Jobpilot.slnx

      - name: Verify formatting
        run: dotnet format Jobpilot.slnx --verify-no-changes --no-restore

      - name: Begin Sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORGANIZATION"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.vscoveragexml.reportsPaths="TestResults/*.xml"
          /d:sonar.exclusions="**/Migrations/**"
          /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build Jobpilot.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --solution Jobpilot.slnx
          --configuration Release --no-build
          --coverage --coverage-output-format xml
          --results-directory TestResults

      - name: End Sonar analysis (fails on red quality gate)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
