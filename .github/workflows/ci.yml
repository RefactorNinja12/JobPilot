name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing by default; each job asks for only what it needs.
permissions: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  HUSKY: 0 # git hooks are for local development only
  SONAR_PROJECT_KEY: RefactorNinja12_JobPilot
  SONAR_ORGANIZATION: refactorninja12

jobs:
  backend:
    name: Backend (format, build, test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # lets SonarCloud decorate PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for accurate Sonar blame / new-code detection

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - uses: actions/setup-java@v4 # required by the Sonar scanner
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore Jobpilot.slnx

      - name: Verify formatting
        run: dotnet format Jobpilot.slnx --verify-no-changes --no-restore

      - name: Check Sonar token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Begin Sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORGANIZATION"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.vscoveragexml.reportsPaths="TestResults/*.xml"
          /d:sonar.exclusions="**/Migrations/**"
          /d:sonar.coverage.exclusions="**/Program.cs"
          /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build Jobpilot.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --solution Jobpilot.slnx
          --configuration Release --no-build
          --coverage --coverage-output-format xml
          --results-directory TestResults

      - name: End Sonar analysis (fails on red quality gate)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

  images:
    name: Docker images (build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Build only; nothing is pushed yet. The shared build stage is cached between the two targets.
      - name: Build worker image
        run: docker build --target worker -t jobpilot-worker:ci .

      - name: Build mcp image
        run: docker build --target mcp -t jobpilot-mcp:ci .

      - name: Images run as non-root
        run: |
          for image in jobpilot-worker:ci jobpilot-mcp:ci; do
            user=$(docker image inspect "$image" --format '{{.Config.User}}')
            echo "$image runs as user '$user'"
            if [ -z "$user" ] || [ "$user" = "0" ] || [ "$user" = "root" ]; then
              echo "::error::$image runs as root"
              exit 1
            fi
          done
