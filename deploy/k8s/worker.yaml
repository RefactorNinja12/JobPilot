# Migrates the database at start, then refreshes the skill vocabulary daily.
# One replica: it owns the schema and the refresh schedule.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 1
  strategy:
    type: Recreate # never two Workers at once
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Wait for PostgreSQL, so the Worker's migration at start does not crash-loop while it boots.
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U jobpilot; do sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsUser: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: worker
          image: jobpilot-worker:local
          imagePullPolicy: Never # imported into k3d by scripts/deploy-local.sh
          env:
            - name: ConnectionStrings__Jobpilot
              valueFrom:
                secretKeyRef:
                  name: jobpilot-db
                  key: connection-string
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi # the vocabulary download (~7 MB JSON, 58k concepts) needs headroom
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
