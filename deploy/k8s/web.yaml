# The web UI and the HTTP API behind it (Jobpilot.Api serving the built UI from wwwroot).
# Locally: kubectl -n jobpilot port-forward svc/web 5299:80   ->   http://localhost:5299
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: jobpilot-web:local
          imagePullPolicy: Never # imported into k3d by scripts/deploy-local.sh
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ConnectionStrings__Jobpilot
              valueFrom:
                secretKeyRef:
                  name: jobpilot-db
                  key: connection-string
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi # the skill vocabulary and place list are loaded in memory
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
