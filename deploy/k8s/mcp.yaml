# The MCP server Claude talks to. Reach it with:
#   kubectl -n jobpilot port-forward svc/mcp 5199:80   ->   http://localhost:5199/mcp
apiVersion: v1
kind: Service
metadata:
  name: mcp
  labels:
    app.kubernetes.io/name: mcp
spec:
  selector:
    app.kubernetes.io/name: mcp
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  labels:
    app.kubernetes.io/name: mcp
spec:
  replicas: 1 # stateless HTTP transport: more replicas would work without session affinity
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: jobpilot-mcp:local
          imagePullPolicy: Never # imported into k3d by scripts/deploy-local.sh
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ConnectionStrings__Jobpilot
              valueFrom:
                secretKeyRef:
                  name: jobpilot-db
                  key: connection-string
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi # search_skills loads the 58k-concept vocabulary
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
