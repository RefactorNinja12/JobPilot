# Local development database. Start with: docker compose up -d
# Bound to 127.0.0.1 only and uses trust auth, so there is no password to manage or leak.
# Not for the cluster: production gets its connection string from the environment.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: jobpilot
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - jobpilot-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "jobpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jobpilot-data:
